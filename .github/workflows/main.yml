name: Render Video Remotion

on:
  repository_dispatch:
    types: [render-trigger]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências
        run: npm install

      - name: Verificar Arquivos na Pasta Public
        run: |
          echo "=== CONTEÚDO DA PASTA PUBLIC ==="
          ls -lah public/
          echo "=== CONTEÚDO DO render.json ==="
          cat public/render.json
          echo "=== FIM DO render.json ==="

      - name: Renderizar Vídeo com Remotion
        run: |
          npx remotion render Resenha1910 out/video.mp4 --concurrency=4

      - name: Verificar Vídeo Renderizado
        run: |
          echo "=== VÍDEO GERADO ==="
          ls -lh out/video.mp4
          file out/video.mp4

      - name: Publicar Vídeo em Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "video-${{ github.run_id }}" out/video.mp4 \
            --title "Vídeo ${{ github.run_id }}" \
            --notes "Renderizado pela execução ${{ github.run_id }}"

      - name: Avisar n8n
        run: |
          VIDEO_URL="https://github.com/${{ github.repository }}/releases/download/video-${{ github.run_id }}/video.mp4"
          echo "URL do vídeo: $VIDEO_URL"
          curl --fail-with-body \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"$VIDEO_URL\",\"run_id\":\"${{ github.run_id }}\"}" \
            "https://women-kurt-symptoms-accounts.trycloudflare.com/f2e1f3af-8081-4a0c-9361-a26e8dd358c5"

      - name: Finalizado
        run: echo "Vídeo publicado e n8n avisado com sucesso."
